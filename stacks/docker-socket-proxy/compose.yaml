services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped

    group_add:
      - "969"
    
    security_opt:
      - label=disable

    environment:
      CONTAINERS: 1
      INFO: 1
      EVENTS: 1

      POST: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - server

networks:
  server:
    external: true